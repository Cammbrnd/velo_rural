name: pipeline-et-deploiement

on:
  workflow_dispatch:          # lancement manuel depuis l'onglet Actions
    inputs:
      routes_calmes:
        description: "Calculer les routes calmes (OSM, lourd : plusieurs Go telecharges)"
        type: boolean
        default: false
  schedule:
    - cron: "17 5 1 * *"      # tous les mois (les jeux Ecolab sont mis a jour annuellement)
  push:
    branches: [main]
    paths: ["app/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # branche "apercu" (images de verification des exemples)
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # ---------- Python : tests puis pipeline ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Tests du pipeline
        run: python -m pytest -q pipeline/tests

      - id: mois
        run: echo "mois=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache des donnees brutes (renouvele chaque mois)
        uses: actions/cache@v4
        with:
          path: pipeline/donnees_brutes
          key: brut-v2-${{ steps.mois.outputs.mois }}
      - name: Cache du resultat des routes calmes (calcul lourd, recalcule chaque mois par le declenchement planifie)
        uses: actions/cache@v4
        with:
          path: |
            pipeline/donnees_brutes/routes_calmes.csv
            pipeline/donnees_brutes/pistes.geojson
          key: routes-calmes-v2-${{ steps.mois.outputs.mois }}
          restore-keys: routes-calmes-v2-
      - name: Cache des derniers exemples (conserves si OSM / Geofabrik est injoignable)
        uses: actions/cache@v4
        with:
          path: app/public/data/exemples.geojson
          key: exemples-v1-${{ github.run_id }}
          restore-keys: exemples-v1-
      - name: Outil osmium pour les extraits OSM (routes calmes, exemples d'amenagement)
        run: sudo apt-get install -y -q osmium-tool
      - name: Pipeline (telechargement, assemblage, export)
        working-directory: pipeline
        env:
          ROUTES_CALMES: ${{ (inputs.routes_calmes || github.event_name == 'schedule') && '1' || '0' }}
        run: python lancer.py
      - name: Apercus des exemples (branche apercu)
        continue-on-error: true
        working-directory: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q matplotlib
          python apercu.py ../apercu
          rm -rf /tmp/ap && mkdir /tmp/ap && cp ../apercu/*.png /tmp/ap/ && cd /tmp/ap
          git init -q -b apercu && git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "apercus du run $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" apercu
      - name: Rapport du pipeline dans le resume du job
        if: always()
        run: |
          [ -f pipeline/donnees_brutes/rapport.md ] && cat pipeline/donnees_brutes/rapport.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Fichiers d'inspection (colonnes des jeux telecharges)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspection-pipeline
          path: |
            pipeline/donnees_brutes/inspection.txt
            pipeline/donnees_brutes/rapport.md
            pipeline/donnees_brutes/catalogue_tbmd.txt
            pipeline/donnees_brutes/catalogue_couches.txt
          if-no-files-found: ignore

      # ---------- Tuiles PMTiles (tippecanoe compile une fois puis mis en cache) ----------
      - name: Cache de tippecanoe
        id: cache-tippe
        uses: actions/cache@v4
        with:
          path: ~/bin/tippecanoe
          key: tippecanoe-v1
      - name: Compiler tippecanoe
        if: steps.cache-tippe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev
          git clone --depth 1 -q https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" > /dev/null
          mkdir -p ~/bin && cp /tmp/tippecanoe/tippecanoe ~/bin/tippecanoe
      - name: Generer les tuiles et configurer l'app
        working-directory: app/public
        run: |
          ~/bin/tippecanoe -q -f -o data/communes.pmtiles -l communes -Z4 -z11 \
            --detect-shared-borders --drop-densest-as-needed --no-tile-size-limit data/communes.geojson
          rm -f data/communes.geojson data/demo.geojson
          taille=$(stat -c %s data/communes.pmtiles); echo "communes.pmtiles : $((taille/1000000)) Mo"
          [ "$taille" -lt 95000000 ] || { echo "::error::PMTiles > 95 Mo : limite GitHub Pages (100 Mo par fichier)"; exit 1; }
          # Les PMTiles sont servis en morceaux de 1 Mo (fichiers entiers) : GitHub Pages + Firefox casse les requetes Range ("Decoding failed")
          decouper() { mkdir -p "$2"; split -b 1048576 -d -a 4 --additional-suffix=.bin "$1" "$2/"; printf '{"taille":%d,"morceau":1048576}' "$(stat -c %s "$1")" > "$2/meta.json"; rm -f "$1"; }
          # ?v=<run> : evite qu'un navigateur melange d'anciens octets (cache des requetes Range) avec le nouveau fichier
          # contours EPCI et pistes cyclables existantes : couches facultatives
          ep=""; if [ -f data/epci.geojson ]; then
            ~/bin/tippecanoe -q -f -o data/epci.pmtiles -l epci -Z4 -z11 --detect-shared-borders --no-tile-size-limit data/epci.geojson
            rm -f data/epci.geojson; decouper data/epci.pmtiles data/epci; ep=",\"epci\":\"data/epci?v=$GITHUB_RUN_ID\""
          fi
          pi=""; if [ -f ../../pipeline/donnees_brutes/pistes.geojson ]; then
            ~/bin/tippecanoe -q -f -o data/pistes.pmtiles -l pistes -Z7 -z12 --drop-densest-as-needed --no-tile-size-limit ../../pipeline/donnees_brutes/pistes.geojson
            t=$(stat -c %s data/pistes.pmtiles); echo "pistes.pmtiles : $((t/1000000)) Mo"
            if [ "$t" -lt 60000000 ]; then decouper data/pistes.pmtiles data/pistes; pi=",\"pistes\":\"data/pistes?v=$GITHUB_RUN_ID\""; else echo "::warning::pistes.pmtiles trop gros, couche ignoree"; rm -f data/pistes.pmtiles; fi
          fi
          ex=""; [ -f data/exemples.geojson ] && ex=",\"exemples\":\"data/exemples.geojson?v=$GITHUB_RUN_ID\""
          decouper data/communes.pmtiles data/communes
          echo "{\"demo\":false,\"source\":{\"type\":\"pmtiles\",\"url\":\"data/communes?v=$GITHUB_RUN_ID\",\"couche\":\"communes\"},\"table\":\"data/indicateurs.json?v=$GITHUB_RUN_ID\"$ex$ep$pi}" > config.json

      # ---------- Application ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tests et build de l'application
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - name: Test navigateur sur les vraies donnees (couche communale visible sur bureau)
        continue-on-error: true
        run: |
          pip install -q playwright
          cd app
          (npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &)
          sleep 5
          python scripts/smoke.py http://127.0.0.1:4173/ /tmp/smoke.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploiement:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
